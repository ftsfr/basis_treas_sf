pull_method = "Futures and OIS pulled from Bloomberg via xbbg; CTD bond prices pulled from CRSP via WRDS"
path = "./_data/ftsfr_treasury_sf_basis.parquet"
date_col = "ds"
docs = """
## Treasury Cash-Futures Basis (Delivery-Adjusted)

Daily Treasury cash-futures basis in basis points, computed with a
delivery-timing-adjusted implied repo rate. Implementation follows
George Lord and Max Zhalilo
([maxz073/p10_Siriwardane_et_al_2026](https://github.com/maxz073/p10_Siriwardane_et_al_2026)),
which replicates the Treasury spot-futures appendix of Siriwardane,
Sunderam, and Wallen (2023), \"Segmented Arbitrage.\"

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Tenor identifier (Treasury_SF_2Y, ..., Treasury_SF_30Y) |
| ds | Date |
| y | Basis spread in basis points |

### The trade

Buy the cheapest-to-deliver (CTD) Treasury, finance it in repo, and sell the
futures contract. At delivery the short receives the invoice price
$F \\cdot CF + A_e$. The break-even financing rate of this cash-and-carry
position is the implied repo rate (IRR).

### Implied repo rate

For trade date $t$ (settlement $t_s = t + 1$ business day) and candidate
delivery date $T_d$:

$$
\\text{IRR}(T_d) = \\frac{F \\cdot CF + A_e + I_c - (P + A_b)}
{(P + A_b)\\, d_1 - I_c\\, d_2}
$$

where

| Symbol | Meaning |
|--------|---------|
| $F$ | Futures price (first-deferred generic contract, `PX_LAST`) |
| $CF$ | Conversion factor of the CTD bond (`FUT_CNVS_FACTOR`) |
| $P$ | CTD clean price (CRSP bid/ask midpoint) |
| $A_b$ | Accrued interest at settlement $t_s$ |
| $A_e$ | Accrued interest at delivery $T_d$ |
| $I_c$ | Intervening coupon ($c/2$ if a coupon date falls in the holding period, else 0) |
| $d_1$ | $(T_d - t_s)/360$ : settlement-to-delivery period (Act/360) |
| $d_2$ | $(T_d - T_{cpn})/360$ : coupon-to-delivery reinvestment period (Act/360) |

Accrued interest uses the Treasury Act/Act convention,
$A = \\frac{c}{2} \\cdot \\frac{\\text{days since last coupon}}{\\text{days in coupon period}}$,
with the semiannual coupon schedule stepped backward from the maturity date.

### Delivery-timing optimization

The futures short owns the delivery timing option. The implied repo is
maximized over candidate delivery dates within the delivery month:

$$
\\text{IRR}^* = \\max_{T_d \\in \\mathcal{D}} \\text{IRR}(T_d), \\quad
\\mathcal{D} = \\{T_{first},\\ T_{last}\\} \\cup
\\{T_{cpn},\\ T_{cpn}^{ex}\\} \\cap [T_{first}, T_{last}]
$$

where $T_{first}$/$T_{last}$ are the first/last weekdays of the contract
month (proxy for the CME delivery window) and $T_{cpn}$/$T_{cpn}^{ex}$ are
the CTD coupon date and its ex-coupon date. Intuition: with positive carry
(coupon income > financing cost) the short delivers late; with negative
carry the short delivers early. Bloomberg's fixed-date implied repo misses
this and understates IRR whenever the fixed date is not optimal.

### Financing benchmark and basis

The OIS rate is linearly interpolated (in days) to the optimal holding
period $h = T_d^* - t_s$ across the available USD OIS curve points
(1M, 2M, 3M, 4M, 5M, 6M, 9M, 1Y as available; Lord and Zhalilo used 2M-9M):

$$
y = \\text{IRR}^* - \\text{OIS}(h) \\quad \\text{(bps)}
$$

### Cleaning

- Futures observations require positive aggregate volume.
- The IRR series is smoothed with a 5-day centered rolling median to dampen
  day-count and price noise (per Lord and Zhalilo).

### Series

| unique_id | Futures contract | Deliverable basket |
|-----------|------------------|--------------------|
| Treasury_SF_2Y | TU (2Y note) | 1y9m-2y notes |
| Treasury_SF_5Y | FV (5Y note) | 4y2m-5y3m notes |
| Treasury_SF_10Y | TY (10Y note) | 6.5y-10y notes |
| Treasury_SF_20Y | US (classic bond) | 15y-25y bonds |
| Treasury_SF_30Y | WN (Ultra Bond) | 25y+ bonds |

Note: Lord and Zhalilo's repository labels WN as 20Y and US as 30Y; this
pipeline follows the Siriwardane et al. convention above (US=20Y, WN=30Y),
consistent with the deliverable baskets.

### Known approximations

- The delivery window is proxied by the first/last weekday of the contract
  month. (At CME, the last delivery day for TU/FV extends three business
  days into the following month; delivery days are exchange business days.)
- The CTD bond is taken from Bloomberg's `FUT_CTD_CUSIP`; the quality
  (CTD-switch) option and end-of-month/wildcard options are not valued.
- The coupon schedule is derived from the maturity date assuming semiannual
  ACT/ACT coupons (CRSP does not provide the schedule directly).

### Data Sources

- Bloomberg: first-deferred Treasury futures (TU2, FV2, TY2, US2, WN2) -
  `PX_LAST`, `FUT_AGGTE_VOL`, `FUT_CTD_CUSIP`, `FUT_CNVS_FACTOR`,
  `CURRENT_CONTRACT_MONTH_YR`; USD OIS (USSO* tickers)
- CRSP/WRDS: `crspm.tfz_dly` joined to `crspm.tfz_iss` for CTD bond clean
  prices (bid/ask mid), accrued interest, coupon rates, and maturity dates
"""

