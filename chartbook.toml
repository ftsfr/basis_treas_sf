docs = """
## Treasury Cash-Futures Basis (Bloomberg Implied Repo)

Time series of the Treasury cash-futures basis by tenor (2Y, 5Y, 10Y, 20Y, 30Y),
computed as Bloomberg's implied repo rate on the first-deferred futures
contract minus the OIS rate interpolated to the contract's time-to-maturity,
in basis points.

### Caveat: fixed delivery-date assumption

Bloomberg's `FUT_IMPLIED_REPO_RT` computes the cash-and-carry return assuming
delivery on a fixed date (the last delivery day). The futures short, however,
owns the delivery timing option: when carry is negative (financing cost
exceeds coupon income), early delivery is optimal. Fixing the delivery date
therefore understates the implied repo in negative-carry environments, which
biases this version of the basis downward relative to the delivery-adjusted
series.
"""

[charts.treasury_sf_basis_comparison]
name = "Treasury Cash-Futures Basis: Method Comparison"
description = "Delivery-adjusted vs Bloomberg-method basis, one panel per tenor"
dataframe = "ftsfr_treasury_sf_basis"
path = "./_output/treasury_sf_basis_comparison.html"
