docs = """
## Method Comparison: Delivery-Adjusted vs Bloomberg Implied Repo

Overlay of the two basis constructions, one panel per tenor. Because the
delivery-adjusted implied repo maximizes over candidate delivery dates, it is
weakly greater than an implied repo computed at any fixed delivery date; the
delivery-adjusted basis therefore sits (weakly) above the Bloomberg-method
basis, with the gap widening when carry is negative and the optimal delivery
moves to the front of the delivery window.
"""
