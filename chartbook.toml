docs = """
## Treasury Cash-Futures Basis (Bloomberg Implied Repo)

Daily Treasury cash-futures basis in basis points, using Bloomberg's own
implied repo field. This is the \"old\" method; it is retained for comparison
with the delivery-adjusted series (`ftsfr_treasury_sf_basis`).

### Columns

| Column | Description |
|--------|-------------|
| unique_id | Tenor identifier (Treasury_SF_2Y, ..., Treasury_SF_30Y) |
| ds | Date |
| y | Basis spread in basis points |

### Methodology

For each tenor, using the first-deferred generic futures contract:

$$
y = \\left( \\text{FUT\\_IMPLIED\\_REPO\\_RT} - \\text{OIS}(TTM) \\right)
\\times 100
$$

- `FUT_IMPLIED_REPO_RT` is Bloomberg's cash-and-carry return of the CTD
  bond, in percent. It assumes delivery on a fixed date (the last delivery
  day of the contract month), ignoring the short's delivery timing option.
- $TTM$ is days from the observation date to the last observed business day
  of the contract month.
- $\\text{OIS}(TTM)$ is piecewise-linear in days across the 1W, 1M, 3M, 6M,
  and 1Y USD OIS rates:

$$
\\text{OIS}(TTM) =
\\begin{cases}
\\text{OIS}_{1W} & TTM \\le 7 \\\\
\\frac{30-TTM}{23}\\,\\text{OIS}_{1W} + \\frac{TTM-7}{23}\\,\\text{OIS}_{1M} & 7 < TTM \\le 30 \\\\
\\frac{90-TTM}{60}\\,\\text{OIS}_{1M} + \\frac{TTM-30}{60}\\,\\text{OIS}_{3M} & 30 < TTM \\le 90 \\\\
\\frac{180-TTM}{90}\\,\\text{OIS}_{3M} + \\frac{TTM-90}{90}\\,\\text{OIS}_{6M} & 90 < TTM \\le 180 \\\\
\\frac{360-TTM}{180}\\,\\text{OIS}_{6M} + \\frac{TTM-180}{180}\\,\\text{OIS}_{1Y} & TTM > 180
\\end{cases}
$$

### Cleaning

- Outliers removed when the absolute deviation from the +/- 45-day rolling
  median exceeds 10 times the window's mean absolute deviation (per tenor).
- Observations require volume in the deferred contract.
- Gaps forward-filled up to 5 business days.
- Sample begins 2004-06-23 (Bloomberg implied repo coverage is unreliable
  before mid-2004).

### Series

Treasury_SF_2Y (TU), Treasury_SF_5Y (FV), Treasury_SF_10Y (TY),
Treasury_SF_20Y (US), Treasury_SF_30Y (WN)

### Data Source

Bloomberg first-deferred Treasury futures (`FUT_IMPLIED_REPO_RT`,
`FUT_AGGTE_VOL`, `CURRENT_CONTRACT_MONTH_YR`) and USD OIS rates
(USSO1Z, USSOA, USSOC, USSOF, USSO1)
"""

[charts.treasury_sf_basis]
name = "Treasury Cash-Futures Basis (Delivery-Adjusted)"
description = "Basis by tenor using the delivery-timing-adjusted implied repo (corrected method)"
dataframe = "ftsfr_treasury_sf_basis"
path = "./_output/treasury_sf_basis.html"
tags = [
    "Treasury futures",
    "implied repo",
    "basis trade",
    "arbitrage",
    "fixed income",
]
docs = """
## Treasury Cash-Futures Basis (Delivery-Adjusted)

Time series of the Treasury cash-futures basis by tenor (2Y, 5Y, 10Y, 20Y, 30Y),
computed as the delivery-timing-adjusted implied repo rate minus the OIS rate
interpolated to the holding period, in basis points.

### Interpretation

- Basis < 0: the cash-and-carry trade (long CTD bond financed in repo, short
  futures) earns less than OIS; a *short* basis position (short the bond,
  long futures) earns a premium. Persistent deviations reflect dealer
  balance-sheet costs and segmented funding markets.
- Basis > 0: the cash-and-carry trade earns more than OIS.
- Spikes coincide with funding stress (e.g., March 2020).

The delivery-adjusted implied repo maximizes the cash-and-carry return over
candidate delivery dates within the delivery month, reflecting the timing
option owned by the futures short.
"""

