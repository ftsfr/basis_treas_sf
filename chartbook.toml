name = "Treasury Cash-Futures Basis (Bloomberg Implied Repo)"
description = "Basis by tenor using Bloomberg's FUT_IMPLIED_REPO_RT (old method)"
dataframe = "ftsfr_treasury_sf_basis_bbg"
path = "./_output/treasury_sf_basis_bbg.html"
