[project]
name = "Treasury Cash-Futures Basis"
description = "Treasury cash-futures (spot-futures) basis: the implied repo rate from delivering the cheapest-to-deliver bond into Treasury futures, minus a maturity-matched OIS rate. Computed two ways: with Bloomberg's fixed-delivery-date implied repo, and with a delivery-timing-adjusted implied repo that lets the short deliver optimally within the delivery month (following Lord and Zhalilo)."
contributors = [
    "Jeremy Bejarano",
    "George Lord",
    "Max Zhalilo",
]
repo_url = "https://github.com/ftsfr/basis_treas_sf"
os_compatibility = [
    "Windows/Linux/MacOS (requires Bloomberg and WRDS)",
]
requires_chartbook = ">=0.4.0"

[scripts]
build = "doit"

